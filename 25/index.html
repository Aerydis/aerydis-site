<body>
    <h3>sun</h3>
    <p>
        What did the human girl want from the sun?<br>
She said to the sky,<br>
I wanted you to cauterize my wounds.<br>
I wanted you to burn away the blood from my lips.<br>
I wanted you to gild my hands.<br>
She lay down on the floor and drank the wide summer sky.<br>
It was so hot in her lungs, the fire.
    </p>
